name: ✨ 기능
description: 새로 만들 기능을 정의합니다.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 무엇을 만드나요?
      description: 한두 문장으로 기능을 설명해주세요.
      placeholder: 플레이어가 폭탄을 던져 적을 제거할 수 있게 한다.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 왜 필요한가요?
      description: 이 기능이 없으면 무엇이 불편한지, 어떤 문제를 푸는지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 무엇이 되면 이 이슈를 닫을 수 있는지 체크리스트로 적어주세요.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 참고
      description: 관련 이슈/PR, 참고 링크, 스케치, 고민 중인 설계 등 (선택)
    validations:
      required: false
