name: 🐛 버그
description: 동작하지 않거나 의도와 다르게 동작하는 부분을 기록합니다.
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 어떤 문제인가요?
      description: 무엇이 잘못 동작하는지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작 / 실제 동작
      value: |
        **기대**: 
        **실제**: 
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 환경
      description: 브라우저, OS, 브랜치/커밋 등 재현에 필요한 정보 (선택)
      placeholder: |
        - 브라우저: Chrome 130
        - OS: macOS 15
        - 커밋: 4bf8119
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 로그 / 스크린샷
      description: 콘솔 에러, 스택 트레이스, 화면 녹화 등 (선택)
    validations:
      required: false
